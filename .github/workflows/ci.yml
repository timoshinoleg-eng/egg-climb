name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected_runtime: linux:x64
          - os: windows-latest
            expected_runtime: win32:x64
          - os: macos-15
            expected_runtime: darwin:arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify runner architecture
        env:
          EXPECTED_RUNTIME: ${{ matrix.expected_runtime }}
        run: node -e "const actual=process.platform+':'+process.arch; console.log('[runtime] '+actual); if(actual!==process.env.EXPECTED_RUNTIME){console.error('expected '+process.env.EXPECTED_RUNTIME); process.exit(1)}"
      - run: npm run typecheck
      - run: npm test

  browser-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
